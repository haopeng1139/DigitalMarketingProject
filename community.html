<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slowpost · Community notes</title>
<meta name="description" content="Short, kind notes from strangers on Slowpost. Pin one, save the ones you love, share them anywhere.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&amp;family=Nunito:wght@400;600;800;900&amp;family=Silkscreen&amp;family=Special+Elite&amp;family=Gaegu:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css">
<style>
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 24px; align-items: start; }
.note { position: relative; display: flex; flex-direction: column; border: 2px solid var(--ink); border-radius: 4px; background: var(--card); box-shadow: 4px 4px 0 var(--ink); }
.note:nth-child(3n+1) { transform: rotate(-1deg); } .note:nth-child(3n+2) { transform: rotate(.8deg); } .note:nth-child(3n) { transform: rotate(-.4deg); }
.note:target, .note.flash { outline: 4px solid var(--teal); outline-offset: 4px; }
.note .front { position: relative; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 150px; }
.note p { margin: 0; font: 700 23px/1.25 Gaegu, cursive; overflow-wrap: anywhere; padding-right: 30px; }
.note .mini { position: absolute; right: 12px; top: 12px; width: 32px; height: 40px; padding: 3px; background: radial-gradient(circle at 3px 3px, transparent 2px, #FAF1DC 2.4px) -3px -3px/6px 6px; }
.note .mini span { display: block; width: 100%; height: 100%; }
.acts { display: flex; align-items: center; flex-wrap: wrap; border-top: 2px dashed rgba(62,42,30,.35); }
.ic { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: 400 13px 'Special Elite', monospace; text-transform: uppercase; letter-spacing: .04em; color: var(--ink); cursor: pointer; }
.ic[aria-pressed="true"] { color: var(--red); }
.menu { position: absolute; left: 10px; right: 10px; top: calc(100% + 4px); z-index: 5; display: flex; flex-direction: column; padding: 6px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--ink); }
.menu .ic { justify-content: flex-start; text-decoration: none; }
.confirm { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 2px dashed rgba(62,42,30,.35); font-size: 14px; }
.colors { display: flex; gap: 8px; }
.colors button { width: 40px; height: 40px; border-radius: 6px; border: 2px solid rgba(62,42,30,.3); cursor: pointer; }
.colors button[aria-pressed="true"] { border: 3px solid var(--ink); }
</style>
</head>
<body>
<div class="airmail airmail-bar"></div>
<header class="top">
  <a class="logo" href="index.html" aria-label="Slowpost home"><img src="assets/slowpost-logo.png" alt="Slowpost"></a>
  <nav class="nav" aria-label="Main">
    <a href="write.html">Write</a>
    <a href="mailbox.html">Mailbox</a>
    <a href="community.html" aria-current="page">Community</a>
  </nav>
  <a class="ticket" href="mailbox.html">Your mailbox</a>
</header>

<main class="wrap" style="display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="tw" style="font-size: 14px; color: var(--red)">The postcard rack</span>
      <h1 class="h1">Community notes</h1>
    </div>
    <p style="margin: 0; font-size: 17px; line-height: 1.55; max-width: 430px">Short, kind notes from strangers. Pin one, save the ones you love, share them anywhere. Notes are anonymous.</p>
  </div>

  <form id="post" class="airmail" style="padding: 8px; border-radius: 8px; box-shadow: 4px 4px 0 var(--ink)">
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 14px; border-radius: 3px; background: var(--card)">
      <label for="note" class="vh">Your note</label>
      <input id="note" type="text" maxlength="280" required placeholder="Write something kind for a stranger to find…" style="flex: 1 1 300px; min-width: 0; min-height: 52px; padding: 0 16px; border: 2px dashed rgba(62,42,30,.45); border-radius: 6px; font: 700 21px Gaegu, cursive; color: var(--ink); background: #fff">
      <div class="colors" role="group" aria-label="Postcard color">
        <button type="button" data-color="mustard" aria-label="Mustard" aria-pressed="true" style="background: #F3C766"></button>
        <button type="button" data-color="sky" aria-label="Sky" aria-pressed="false" style="background: #BFDDD8"></button>
        <button type="button" data-color="peach" aria-label="Peach" aria-pressed="false" style="background: #F2B49A"></button>
        <button type="button" data-color="cream" aria-label="Cream" aria-pressed="false" style="background: #FAF1DC"></button>
      </div>
      <button type="submit" class="btn-stamp small" id="pin">Pin it</button>
    </div>
  </form>
  <p id="post-msg" class="msg" hidden role="status"></p>

  <p id="status" class="tw" role="status" style="margin: 0; font-size: 14px">Loading the board…</p>
  <div class="board" id="board"></div>
</main>

<footer class="foot">
  <div class="inner">
    <span class="tw" style="font-size: 13px; opacity: .8">Follow the mail</span>
    <nav aria-label="Slowpost on social media">
      <a href="https://www.instagram.com/slowpostletter/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.facebook.com/profile.php?id=61595393611281" target="_blank" rel="noopener">Facebook</a>
      <a href="https://www.pinterest.com/slowpost/" target="_blank" rel="noopener">Pinterest</a>
      <a href="https://x.com/slowpostletter" target="_blank" rel="noopener">X</a>
    </nav>
  </div>
  <div class="airmail airmail-bar"></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(async function () {
  var SP = window.Slowpost, esc = SP.esc;
  function $(id) { return document.getElementById(id); }
  function toast(m) { var t = document.createElement('div'); t.className = 'sp-toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }
  var BG = { mustard: '#F3C766', sky: '#BFDDD8', peach: '#F2B49A', cream: '#FAF1DC' };
  var STAMP = { mustard: '#C2412D', sky: '#2B5A8A', peach: '#3E8A86', cream: '#E8A93A' };
  var color = 'mustard', notes = [], saved = {}, me = null, openMenu = null, confirmFor = null;

  function ago(d) {
    var s = (Date.now() - new Date(d).getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function noteUrl(id) { var u = new URL('community.html', location.href); u.hash = 'n-' + id; return u.href; }

  function render() {
    if (!notes.length) { $('board').innerHTML = '<p style="margin: 0; padding: 22px; border: 2px dashed rgba(62,42,30,.35); border-radius: 8px; font-size: 17px; grid-column: 1 / -1">The rack is empty. Be the first to pin a kind note.</p>'; return; }
    $('board').innerHTML = notes.map(function (n) {
      var isSaved = !!saved[n.id], mine = me && n.mailbox_id === me.id;
      var menu = openMenu === n.id ? '<div class="menu" role="menu" aria-label="Share this note">' +
        '<button type="button" role="menuitem" class="ic" data-copy="' + n.id + '">Copy link</button>' +
        '<a role="menuitem" class="ic" target="_blank" rel="noopener" href="https://x.com/intent/post?text=' + encodeURIComponent('“' + n.body + '” · found on @slowpostletter') + '&url=' + encodeURIComponent(noteUrl(n.id)) + '">Share on X</a>' +
        '<a role="menuitem" class="ic" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(noteUrl(n.id)) + '">Share on Facebook</a>' +
        '<a role="menuitem" class="ic" target="_blank" rel="noopener" href="https://www.pinterest.com/pin/create/button/?url=' + encodeURIComponent(noteUrl(n.id)) + '&description=' + encodeURIComponent(n.body + ' · Slowpost') + '">Pin on Pinterest</a>' +
        '<button type="button" role="menuitem" class="ic" data-image="' + n.id + '">Save image for Instagram</button></div>' : '';
      var confirm = confirmFor === n.id ? '<div class="confirm" role="alert"><span>Report this note as unkind or spam? Notes with 3 reports are hidden until we review them.</span><span style="display: flex; gap: 8px"><button type="button" class="btn-plain" data-report-yes="' + n.id + '">Report it</button><button type="button" class="link" data-report-no="1">Cancel</button></span></div>' : '';
      return '<article class="note" id="n-' + n.id + '">' +
        '<div class="front" style="background: ' + (BG[n.color] || BG.mustard) + '"><span class="mini" aria-hidden="true"><span style="background: ' + (STAMP[n.color] || STAMP.mustard) + '"></span></span>' +
        '<span class="tw" style="font-size: 12px">' + esc(ago(n.created_at)) + (mine ? ' · yours' : '') + '</span><p>' + esc(n.body) + '</p>' +
        '<span class="tw" style="font-size: 12px">' + (n.save_count ? 'Saved ' + n.save_count + '×' : 'Pinned') + '</span></div>' +
        '<div class="acts"><button type="button" class="ic" data-save="' + n.id + '" aria-pressed="' + isSaved + '">' + (isSaved ? '♥ Saved' : '♡ Save') + '</button>' +
        '<button type="button" class="ic" data-share="' + n.id + '" aria-expanded="' + (openMenu === n.id) + '">Share</button>' +
        (mine ? '<button type="button" class="ic" data-remove="' + n.id + '" style="margin-left: auto">Remove</button>' : '<button type="button" class="ic" data-report="' + n.id + '" style="margin-left: auto; opacity: .75">Report</button>') +
        '</div>' + confirm + menu + '</article>';
    }).join('');
  }

  async function load() {
    try { me = await SP.ready(); } catch (e) { me = null; }
    var r = await SP.sb.from('community_notes').select('id, mailbox_id, body, color, save_count, created_at').order('created_at', { ascending: false }).limit(90);
    if (r.error) { $('status').textContent = 'We couldn’t load the board: ' + r.error.message; return; }
    notes = r.data;
    if (me) {
      var s = await SP.sb.from('note_saves').select('note_id');
      saved = {}; (s.data || []).forEach(function (x) { saved[x.note_id] = true; });
      var rep = await SP.sb.from('note_reports').select('note_id'), gone = {};
      (rep.data || []).forEach(function (x) { gone[x.note_id] = true; });
      notes = notes.filter(function (n) { return !gone[n.id]; });
    }
    $('status').hidden = true;
    render();
    var target = location.hash.replace('#n-', '');
    if (target && $('n-' + target)) { $('n-' + target).scrollIntoView({ block: 'center' }); $('n-' + target).classList.add('flash'); }
  }

  document.querySelectorAll('[data-color]').forEach(function (b) {
    b.addEventListener('click', function () { color = b.getAttribute('data-color'); document.querySelectorAll('[data-color]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); });
  });

  $('post').addEventListener('submit', async function (e) {
    e.preventDefault();
    var body = $('note').value.trim(), msg = $('post-msg');
    if (body.length < 3) { msg.className = 'msg err'; msg.textContent = 'Write at least a few words.'; msg.hidden = false; return; }
    $('pin').disabled = true;
    try {
      me = await SP.ready();
      var r = await SP.sb.from('community_notes').insert({ mailbox_id: me.id, body: body, color: color }).select('id, mailbox_id, body, color, save_count, created_at').single();
      if (r.error) throw r.error;
      notes.unshift(r.data); $('note').value = ''; msg.hidden = true; render();
      toast('Pinned to the rack.');
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message || String(err); msg.hidden = false; }
    finally { $('pin').disabled = false; }
  });

  document.addEventListener('click', async function (e) {
    var b = e.target.closest('button, a'); if (!b) return;
    var id;
    if ((id = b.getAttribute('data-share'))) { openMenu = openMenu === id ? null : id; confirmFor = null; render(); return; }
    if ((id = b.getAttribute('data-copy'))) {
      var u = noteUrl(id); openMenu = null; render();
      if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast('Link copied.'); }, function () { toast(u); }); else toast(u);
      return;
    }
    if ((id = b.getAttribute('data-image'))) { openMenu = null; render(); saveImage(notes.filter(function (n) { return n.id === id; })[0]); return; }
    if ((id = b.getAttribute('data-save'))) {
      if (!me) me = await SP.ready();
      var on = !saved[id], note = notes.filter(function (n) { return n.id === id; })[0];
      var r = on ? await SP.sb.from('note_saves').insert({ mailbox_id: me.id, note_id: id }) : await SP.sb.from('note_saves').delete().eq('note_id', id).eq('mailbox_id', me.id);
      if (r.error) { toast('That didn’t save. Try again.'); return; }
      if (on) saved[id] = true; else delete saved[id];
      note.save_count = Math.max(0, (note.save_count || 0) + (on ? 1 : -1));
      render(); return;
    }
    if ((id = b.getAttribute('data-report'))) { confirmFor = id; openMenu = null; render(); return; }
    if (b.hasAttribute('data-report-no')) { confirmFor = null; render(); return; }
    if ((id = b.getAttribute('data-report-yes'))) {
      if (!me) me = await SP.ready();
      var rr = await SP.sb.from('note_reports').insert({ mailbox_id: me.id, note_id: id });
      confirmFor = null;
      if (rr.error && rr.error.code !== '23505') { toast('The report didn’t go through. Try again.'); render(); return; }
      notes = notes.filter(function (n) { return n.id !== id; }); render();
      toast('Thanks. We’ve hidden it for you and noted the report.');
      return;
    }
    if ((id = b.getAttribute('data-remove'))) {
      var rd = await SP.sb.from('community_notes').delete().eq('id', id);
      if (rd.error) { toast('Couldn’t remove it. Try again.'); return; }
      notes = notes.filter(function (n) { return n.id !== id; }); render(); toast('Removed from the rack.');
      return;
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (openMenu || confirmFor)) { openMenu = null; confirmFor = null; render(); } });

  // A 1080×1350 postcard image of the note, for Instagram posts and stories.
  function saveImage(n) {
    if (!n) return;
    var c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    var x = c.getContext('2d');
    x.fillStyle = '#F3E4C4'; x.fillRect(0, 0, 1080, 1350);
    for (var i = -1350; i < 1080 + 1350; i += 88) {   // airmail border
      x.save(); x.beginPath(); x.rect(0, 0, 1080, 1350); x.rect(40, 40, 1000, 1270); x.clip('evenodd');
      x.translate(i, 0); x.rotate(Math.PI / 4);
      x.fillStyle = '#C2412D'; x.fillRect(0, -2000, 28, 4000); x.fillStyle = '#2B5A8A'; x.fillRect(44, -2000, 28, 4000);
      x.restore();
    }
    x.fillStyle = BG[n.color] || BG.mustard; x.fillRect(110, 200, 860, 860);
    x.strokeStyle = '#3E2A1E'; x.lineWidth = 6; x.strokeRect(110, 200, 860, 860);
    x.fillStyle = '#3E2A1E'; x.font = '54px Gaegu, cursive'; x.textBaseline = 'top';
    var words = n.body.split(/\s+/), line = '', y = 280, lines = [];
    words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (x.measureText(t).width > 720) { lines.push(line); line = w; } else line = t; });
    lines.push(line);
    var lh = 70; y = 630 - (lines.length * lh) / 2;
    x.font = 'bold 54px Gaegu, cursive';
    lines.forEach(function (l) { x.fillText(l, 170, y); y += lh; });
    x.font = '34px "Special Elite", monospace'; x.fillText('SLOWPOST.WORLD · COMMUNITY NOTES', 170, 1120);
    x.font = '34px "Special Elite", monospace'; x.fillText('@SLOWPOSTLETTER', 170, 1170);
    c.toBlob(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'slowpost-note.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('Image saved. Post it to your Instagram story or feed.');
    }, 'image/png');
  }

  load();
})();
</script>
</body>
</html>
